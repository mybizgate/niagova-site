# Niagova corporate site configuration. The slug is the permanent identity; the domain may change later.
client:
  name: Niagova
  slug: niagova
template:
  type: blank
platform_ref: v1.5.0
domain:
  type: custom
  primary: niagova.com
  dns_mode: awedns
hosting:
  deploy_dir: public_html/niagova-site/
  ftp_account: shared
site:
  kind: corporate
  environment: production
  production_url: https://niagova.com
  identity: Niagova
build:
  exclude: []
  images:
    convert: true
    quality: 82
    max_width: 1920
    preserve: []
  cache_bust: true
qa:
  lighthouse: false
  browser_smoke: false
  screenshots: false
github:
  repo: niagova-site
  visibility: public
